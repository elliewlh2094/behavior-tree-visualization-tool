<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <title>Behavior Tree Visualizer</title>
    <script>
      // FOUC prevention: resolve the theme synchronously before React mounts so
      // dark-mode users don't see a flash of light. Route-aware to match the app:
      //   - Landing (#/ and everything else): ALWAYS follows the OS/browser
      //     (prefers-color-scheme); the landing page has no theme control, so the
      //     saved editor preference is intentionally ignored here.
      //   - Editor (#/editor): reads the saved preference (same localStorage
      //     key/shape the persist middleware writes), defaulting to 'system'.
      // Falls back to 'system' if anything goes wrong (corrupt JSON, missing key,
      // matchMedia unavailable). useTheme / useSystemThemeClass keep the class in
      // sync after hydration; this just paints the first frame correctly.
      (function () {
        try {
          var isEditor = window.location.hash.indexOf('#/editor') === 0;
          var theme = 'system';
          if (isEditor) {
            var raw = localStorage.getItem('bt-visualizer-preferences');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.state && typeof parsed.state.theme === 'string') {
                theme = parsed.state.theme;
              }
            }
          }
          var resolved = theme;
          if (theme === 'system' && window.matchMedia) {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {
          /* fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
